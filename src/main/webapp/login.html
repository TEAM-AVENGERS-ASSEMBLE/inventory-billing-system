<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Sign In | Inventory & Billing System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body style="min-height: 100vh; background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #0f172a 85%); display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

    <div class="login-card" style="margin: auto;">
        <div class="login-header">
            <div class="login-icon-badge">📦</div>
            <h1 class="login-title">Inventory & Billing System</h1>
            <p class="login-subtitle">POS Terminal & Stock Management Portal</p>
        </div>

        <div id="login-alert" class="login-alert" style="display: none;">
            <span>⚠️</span>
            <span id="login-alert-text">Invalid username or password.</span>
        </div>

        <form id="standalone-login-form" onsubmit="handleStandaloneLogin(event)">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label" for="login-username">Terminal Username</label>
                <div class="input-with-icon">
                    <span class="input-icon">👤</span>
                    <input type="text" id="login-username" class="form-input" placeholder="e.g. admin or cashier" required autocomplete="username">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label" for="login-password">Password</label>
                <div class="input-with-icon">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="login-role">Terminal Station Role</label>
                <select id="login-role" class="form-select">
                    <option value="admin">Store Admin / Manager (Full Access)</option>
                    <option value="cashier">POS Cashier (Billing & Invoicing)</option>
                </select>
            </div>

            <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block btn-login">
                <span id="login-btn-text">Sign In to Terminal</span>
            </button>
        </form>

        <div class="login-divider">
            <span>Quick Demo Accounts</span>
        </div>

        <div class="quick-login-grid">
            <button type="button" class="btn-demo-account" onclick="quickFill('admin', 'admin123', 'admin')">
                <span class="demo-account-role">👤 Store Admin</span>
                <span class="demo-account-creds">admin / admin123</span>
            </button>
            <button type="button" class="btn-demo-account" onclick="quickFill('cashier', 'cashier123', 'cashier')">
                <span class="demo-account-role">🏷️ POS Cashier</span>
                <span class="demo-account-creds">cashier / cashier123</span>
            </button>
        </div>

        <div class="login-footer-info">
            <span>Java Servlets 4.0 · JDBC · MySQL · Dual Mode POS</span>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.api.getCurrentUser()) {
                window.location.href = 'index.html';
            }
        });

        async function handleStandaloneLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            const r = document.getElementById('login-role').value;
            const alertBox = document.getElementById('login-alert');
            const alertText = document.getElementById('login-alert-text');
            const btn = document.getElementById('btn-login-submit');

            if (alertBox) alertBox.style.display = 'none';
            if (btn) btn.disabled = true;

            try {
                await window.api.login(u, p, r);
                window.location.href = 'index.html';
            } catch (err) {
                if (alertBox && alertText) {
                    alertText.textContent = err.message || 'Login failed.';
                    alertBox.style.display = 'flex';
                }
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        function quickFill(u, p, r) {
            document.getElementById('login-username').value = u;
            document.getElementById('login-password').value = p;
            document.getElementById('login-role').value = r;
            handleStandaloneLogin(new Event('submit'));
        }
    </script>
</body>
</html>
